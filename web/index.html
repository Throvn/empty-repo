<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdfTeX in WebAssembly</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#dcdad4; --accent:#b3261e; --ok:#1b7f3b; --warn:#9a6700; --sel:#fdecea; --gut:#efede8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1b1d; --panel:#242427; --ink:#ececee; --muted:#9a9aa2; --line:#38383d; --accent:#ff8a80; --ok:#6fd58a; --warn:#e3b341; --sel:#3a2523; --gut:#2b2b2f; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: .4rem .9rem; align-items: center; padding: .5rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 1rem; margin: 0 .6rem 0 0; font-weight: 650; }
  button, select { font: inherit; padding: .35rem .8rem; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  button.small { padding: .15rem .55rem; font-size: 12px; }
  label { color: var(--muted); display: inline-flex; gap: .35rem; align-items: center; cursor: pointer; }
  #status { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; max-width: 55vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status b { color: var(--ink); }
  .err { color: var(--accent); } .warn { color: var(--warn); }
  .pill { display: inline-block; padding: 0 .5rem; border-radius: 99px; background: var(--line); font-size: 12px; margin-left: .25rem; }
  .pill.warm { background: var(--ok); color: #fff; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 11rem minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  @media (max-width: 900px) { main { grid-template-columns: 8rem 1fr; grid-template-rows: 1fr 1fr auto; } #view { grid-column: 1 / -1; } }
  #files { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #files .tools { display: flex; gap: .3rem; padding: .5rem; border-bottom: 1px solid var(--line); }
  #filelist { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  #filelist li { padding: .3rem .6rem; cursor: pointer; display: flex; justify-content: space-between; gap: .3rem; align-items: center; white-space: nowrap; }
  #filelist li span.n { overflow: hidden; text-overflow: ellipsis; }
  #filelist li.active { background: var(--sel); font-weight: 600; }
  #filelist li .x { visibility: hidden; color: var(--muted); }
  #filelist li:hover .x { visibility: visible; }
  #filelist li.main::before { content: "★"; color: var(--accent); margin-right: .25rem; }
  #editor { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
  #tab { padding: .3rem .8rem; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
  #ed { flex: 1; min-height: 0; display: flex; position: relative; }
  #gutter { width: 3.2rem; padding: 1rem .4rem 1rem 0; text-align: right; background: var(--gut); color: var(--muted); overflow: hidden; user-select: none;
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre; }
  #gutter .e { color: var(--accent); font-weight: 700; } #gutter .w { color: var(--warn); font-weight: 700; }
  #src { flex: 1; min-width: 0; resize: none; border: 0; padding: 1rem; outline: none; background: var(--panel); color: var(--ink); white-space: pre; overflow: auto;
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; tab-size: 2; }
  #binpane { flex: 1; padding: 1rem; overflow: auto; } #binpane img { max-width: 100%; border: 1px solid var(--line); }
  #view { overflow: auto; background: #8a8a90; padding: 12px 0; min-width: 0; }
  #view canvas { display: block; margin: 0 auto 12px; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.4); }
  #view .ph { margin: 0 auto 12px; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.4); }
  #bottom { grid-column: 1 / -1; border-top: 1px solid var(--line); background: var(--panel); }
  #tabs { display: flex; gap: .2rem; padding: .2rem .6rem 0; border-bottom: 1px solid var(--line); }
  #tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: .3rem .7rem; }
  #tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  #panes > * { display: none; height: 170px; overflow: auto; margin: 0; padding: .4rem .8rem; }
  #panes > .on { display: block; }
  #log, #console { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
  #problems .p { padding: .15rem .3rem; cursor: pointer; display: flex; gap: .6rem; border-radius: 4px; }
  #problems .p:hover { background: var(--sel); }
  #problems .p .k { width: 4.5rem; flex: none; } #problems .p .loc { width: 9rem; flex: none; color: var(--muted); }
  #drop { position: fixed; inset: 0; background: rgba(179,38,30,.15); border: 3px dashed var(--accent); display: none; align-items: center; justify-content: center; font-size: 1.4rem; pointer-events: none; }
  body.dragging #drop { display: flex; }
</style>
</head>
<body>
<header>
  <h1>pdfTeX → WebAssembly</h1>
  <button id="compile" class="primary" disabled>Compile</button>
  <label><input type="checkbox" id="live" checked> live</label>
  <label><input type="checkbox" id="incr" checked> incremental</label>
  <label>main <select id="mainsel"></select></label>
  <button id="long" title="a 60-section document: watch incremental compilation skip the unchanged prefix">Long sample</button>
  <a id="dl" download="main.pdf" hidden><button>Download PDF</button></a>
  <button id="stop" hidden title="TeX seems stuck (infinite loop?): kill the worker and restart the engine">Stop</button>
  <span id="status">loading…</span>
</header>
<main>
  <aside id="files">
    <div class="tools"><button class="small" id="newfile" title="new file (use dir/name for subfolders)">+ file</button><button class="small" id="upload" title="images, .bib, .sty ... (or drop them anywhere)">upload</button></div>
    <ul id="filelist"></ul>
    <input type="file" id="picker" multiple hidden>
  </aside>
  <section id="editor">
    <div id="tab"><span id="tabname"></span><span id="tabinfo"></span></div>
    <div id="ed"><div id="gutter"></div><textarea id="src" spellcheck="false" wrap="off" autofocus></textarea><div id="binpane" hidden></div></div>
  </section>
  <section id="view"></section>
  <section id="bottom">
    <div id="tabs"><button data-p="problems" class="on">Problems <span id="pcount"></span></button><button data-p="log">TeX log</button><button data-p="console">Console</button></div>
    <div id="panes"><div id="problems" class="on"></div><pre id="log"></pre><pre id="console"></pre></div>
  </section>
</main>
<div id="drop">Drop files to add them to the project</div>
<script type="module">
import { PdfView } from './viewer.js';
import { Project, isText } from './project.js';
import { parseProblems } from './problems.js';

const SAMPLE = String.raw`\documentclass[11pt]{article}
\usepackage[T1]{fontenc}
\usepackage{lmodern}
\usepackage{amsmath,amssymb}
\usepackage[a4paper,margin=2.5cm]{geometry}
\usepackage{graphicx}
\usepackage{hyperref}

\title{Hello from WebAssembly}
\author{pdfTeX running in your browser}
\date{}

\begin{document}
\maketitle

\section{Typesetting}
This page was typeset by \emph{pdfTeX} compiled to a single \texttt{wasm} binary.
Edit the text on the left and the PDF on the right updates immediately.

\begin{align}
  \int_{-\infty}^{\infty} e^{-x^2}\,dx &= \sqrt{\pi}, &
  \zeta(s) &= \sum_{n=1}^{\infty} \frac{1}{n^s} = \prod_{p}\frac{1}{1-p^{-s}}.
\end{align}

\section{Cross references}
See Section~\ref{sec:more} on page~\pageref{sec:more}.
Drop a PNG or JPEG onto this page and include it with
\verb|\includegraphics{name.png}|; add more \texttt{.tex} files with \verb|\input|.

\section{More}\label{sec:more}
Ligatures: fi fl ffi. Quotes: \textquotedblleft double\textquotedblright. Dashes: 1--2, em---dash.

\end{document}
`;

function longSample() {
  const words = 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua'.split(' ');
  let seed = 7; const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const para = n => Array.from({ length: n }, () => words[Math.floor(rnd() * words.length)]).join(' ') + '.';
  const out = ['\\documentclass{article}', '\\usepackage{amsmath}', '\\usepackage[margin=2.5cm]{geometry}',
    '\\title{A long document}', '\\author{wasm}', '\\begin{document}', '\\maketitle', '\\tableofcontents', '\\newpage'];
  for (let i = 1; i <= 60; i++) {
    out.push(`\\section{Section number ${i}}\\label{sec:${i}}`);
    for (let j = 0; j < 6; j++) out.push(para(70), '');
    out.push(`\\begin{equation} \\sum_{k=1}^{${i}} k = \\frac{${i}(${i}+1)}{2} \\end{equation}`, `See Section~\\ref{sec:${Math.max(1, i - 1)}}.`, '');
  }
  out.push('\\end{document}');
  return out.join('\n') + '\n';
}

const $ = id => document.getElementById(id);
const src = $('src'), statusEl = $('status'), gutter = $('gutter');
const view = new PdfView($('view'));
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ------------------------------------------------------------------------------------------ project
let project = await Project.load();
if (!project || !project.files.size) { project = new Project(); project.setText('main.tex', SAMPLE); }
let problems = [];

const worker0 = () => {
  const w = new Worker('worker.js', { type: 'module' });
  w.onmessage = onMessage; w.onerror = e => setStatus(`<span class="err">worker error: ${esc(e.message || '')}</span>`);
  return w;
};
let worker, ready = false, busy = false, dirty = false, nextId = 1, lastUrl = null, watchdog = null, autoCompile = true, saveTimer = null;
const setStatus = html => { statusEl.innerHTML = html; };

function pushFiles(names, removed = []) {
  const set = {}; for (const n of names) set[n] = project.payload(n);
  worker.postMessage({ type: 'files', set, remove: removed });
}
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(() => project.save(), 400); }

// ------------------------------------------------------------------------------------------ file list / editor
function renderFiles() {
  const ul = $('filelist'); ul.replaceChildren();
  for (const n of project.names()) {
    const li = document.createElement('li');
    li.className = (n === project.active ? 'active ' : '') + (n === project.main ? 'main' : '');
    li.innerHTML = `<span class="n" title="${esc(n)}">${esc(n)}</span><span class="x" title="delete">✕</span>`;
    li.onclick = e => { if (e.target.classList.contains('x')) removeFile(n); else openFile(n); };
    li.ondblclick = () => renameFile(n);
    ul.appendChild(li);
  }
  const sel = $('mainsel'); sel.replaceChildren();
  for (const n of project.names().filter(n => n.endsWith('.tex'))) { const o = new Option(n, n, false, n === project.main); sel.appendChild(o); }
}
function openFile(n, line) {
  project.active = n; persist();
  const f = project.get(n); if (!f) return;
  $('tabname').textContent = n; renderFiles();
  const isTxt = f.text !== undefined;
  src.hidden = !isTxt; gutter.hidden = !isTxt; $('binpane').hidden = isTxt;
  if (isTxt) { src.value = f.text; $('tabinfo').textContent = n === project.main ? 'main file' : ''; renderGutter(); if (line) gotoLine(line); }
  else {
    const mime = /\.png$/i.test(n) ? 'image/png' : /\.jpe?g$/i.test(n) ? 'image/jpeg' : '';
    $('binpane').innerHTML = `<p>${f.bytes.length.toLocaleString()} bytes</p>`;
    if (mime) { const img = new Image(); img.src = URL.createObjectURL(new Blob([f.bytes], { type: mime })); $('binpane').appendChild(img); }
    $('tabinfo').textContent = 'binary';
  }
}
function gotoLine(line) {
  const lines = src.value.split('\n'); let pos = 0;
  for (let i = 0; i < line - 1 && i < lines.length; i++) pos += lines[i].length + 1;
  src.focus(); src.setSelectionRange(pos, pos + (lines[line - 1] || '').length);
  const lh = parseFloat(getComputedStyle(src).lineHeight); src.scrollTop = Math.max(0, (line - 6) * lh);
  syncGutter();
}
function renderGutter() {
  const n = src.value.split('\n').length, mark = new Map();
  for (const p of problems) if (p.file === project.active && p.line && p.kind !== 'box') mark.set(p.line, p.kind === 'error' ? 'e' : mark.get(p.line) || 'w');
  let h = '';
  for (let i = 1; i <= n; i++) h += mark.has(i) ? `<span class="${mark.get(i)}">${i}●</span>\n` : i + '\n';
  gutter.innerHTML = h; syncGutter();
}
const syncGutter = () => { gutter.scrollTop = src.scrollTop; };
src.addEventListener('scroll', syncGutter);

function addFile(name, content) {
  name = name.replace(/^\/+/, '');
  if (!name) return;
  if (content instanceof Uint8Array) project.setBytes(name, content); else project.setText(name, content);
  pushFiles([name]); renderFiles(); persist();
}
function removeFile(n) {
  if (n === project.main && !confirm(`${n} is the main file. Delete it?`)) return;
  if (n !== project.main && !confirm(`Delete ${n}?`)) return;
  project.remove(n); pushFiles([], [n]);
  if (project.main === n) project.main = project.names().find(x => x.endsWith('.tex')) || 'main.tex';
  openFile(project.get(project.active) ? project.active : project.main); persist(); compile();
}
function renameFile(n) {
  const to = prompt('Rename to:', n); if (!to || to === n) return;
  const f = project.get(n); if (!project.rename(n, to)) return alert('name exists');
  pushFiles([to], [n]); openFile(project.active); persist(); compile();
}
$('newfile').onclick = () => { const n = prompt('File name (e.g. chapter1.tex or figs/plot.tex):', 'chapter1.tex'); if (n && !project.get(n)) { addFile(n, ''); openFile(n); } };
$('upload').onclick = () => $('picker').click();
async function ingest(fileList) {
  for (const f of fileList) { const b = new Uint8Array(await f.arrayBuffer()); addFile(f.webkitRelativePath || f.name, b); }
  const last = [...fileList].pop(); if (last) openFile(last.name);
  compile();
}
$('picker').onchange = e => { ingest(e.target.files); e.target.value = ''; };
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); if (e.dataTransfer.files.length) ingest(e.dataTransfer.files); });
$('mainsel').onchange = e => { project.main = e.target.value; persist(); renderFiles(); compile(); };

// ------------------------------------------------------------------------------------------ bottom panes
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  for (const id of ['problems', 'log', 'console']) $(id).classList.toggle('on', id === b.dataset.p);
});
function renderProblems() {
  const sorted = problems.filter(p => !p.system);
  $('pcount').textContent = sorted.length ? `(${sorted.filter(p => p.kind === 'error').length} errors, ${sorted.filter(p => p.kind !== 'error').length} warnings)` : '';
  $('problems').innerHTML = sorted.length ? sorted.map((p, i) =>
    `<div class="p" data-i="${i}"><span class="k ${p.kind === 'error' ? 'err' : 'warn'}">${p.kind}</span><span class="loc">${esc(p.file)}${p.line ? ':' + p.line : ''}</span><span>${esc(p.message)}${p.count > 1 ? ' ×' + p.count : ''}${p.context ? ' <code>' + esc(p.context.slice(0, 80)) + '</code>' : ''}</span></div>`).join('')
    : '<span style="color:var(--muted)">No problems.</span>';
  $('problems').querySelectorAll('.p').forEach(el => el.onclick = () => { const p = sorted[+el.dataset.i]; if (project.get(p.file)) openFile(p.file, p.line); });
  renderGutter();
}

// ------------------------------------------------------------------------------------------ compile
function onMessage(ev) {
  const m = ev.data;
  if (m.type === 'error' || (m.type === 'result' && m.final)) { clearTimeout(watchdog); $('stop').hidden = true; }
  else if (m.type === 'result') { clearTimeout(watchdog); watchdog = setTimeout(() => { $('stop').hidden = false; }, 8000); }
  if (m.type === 'progress') setStatus(m.text);
  else if (m.type === 'ready') {
    ready = true; $('compile').disabled = false;
    setStatus(`engine ready (${(m.ms / 1000).toFixed(1)} s load, ${m.wasmKB} KB wasm; ${m.files.toLocaleString()} TeX files / ${m.packMB} MB fetched on demand${m.simd ? '; SIMD snapshots' : ''})`);
    pushFiles(project.names());
    if (autoCompile) compile(); else setStatus(statusEl.textContent + ' — restarted; edit or press Compile');
    autoCompile = true;
  } else if (m.type === 'result') {
    busy = !m.final;
    $('log').textContent = m.log || ''; $('console').textContent = m.console || '';
    problems = parseProblems(m.log || '', project.main); renderProblems();
    const modes = (m.pass ? 'pass ' + (m.pass + 1) + ': ' : '') + m.passes.map(p => p.mode === 'resume' ? `resumed@${p.resumedAtEvent}` : p.mode).join(' + ');
    if (m.pdf) {
      view.show(m.pdf).catch(() => {});
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(new Blob([m.pdf], { type: 'application/pdf' }));
      $('dl').href = lastUrl; $('dl').download = project.main.replace(/\.tex$/, '.pdf'); $('dl').hidden = false;
    }
    const warm = m.passes.some(p => p.mode === 'resume' || p.mode === 'cached');
    const ne = problems.filter(p => p.kind === 'error' && !p.system).length, nw = problems.filter(p => p.kind !== 'error' && !p.system).length;
    setStatus(`<b>${m.ms.toFixed(0)} ms</b> <span class="pill ${warm ? 'warm' : ''}">${modes}</span> · ${m.stats.snapshotsHeld} snapshots` +
              (ne ? ` · <span class="err">${ne} error${ne > 1 ? 's' : ''}</span>` : '') + (nw ? ` · <span class="warn">${nw} warning${nw > 1 ? 's' : ''}</span>` : '') +
              (m.final ? '' : ' · <i>refining cross-references…</i>') + (m.pdf ? '' : ' <span class="err">no PDF — see Problems/log</span>'));
    if (!m.pdf && ne) document.querySelector('#tabs [data-p=problems]').click();
    if (m.final && dirty) { dirty = false; compile(); }
  } else if (m.type === 'error') {
    busy = false; setStatus(`<span class="err">${esc(m.message.split('\n')[0])}</span>`); $('log').textContent = m.message;
  }
}
function compile() {
  if (!ready) return;
  if (busy) { dirty = true; return; }
  busy = true; setStatus('compiling…');
  clearTimeout(watchdog); watchdog = setTimeout(() => { $('stop').hidden = false; }, 8000);
  worker.postMessage({ type: 'compile', id: nextId++, main: project.main, incremental: $('incr').checked, maxPasses: 3 });
}
let timer = null;
src.addEventListener('input', () => {
  const f = project.get(project.active); if (!f || f.text === undefined) return;
  f.text = src.value; pushFiles([project.active]); persist(); renderGutter();
  if ($('live').checked) { clearTimeout(timer); timer = setTimeout(compile, 120); }
});
src.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); } });
$('compile').onclick = compile;
$('long').onclick = () => { addFile('long.tex', longSample()); project.main = 'long.tex'; openFile('long.tex'); compile(); };
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') compile(); });
$('stop').onclick = () => { autoCompile = false; worker.terminate(); $('stop').hidden = true; busy = false; ready = false; $('compile').disabled = true; setStatus('engine stopped — restarting…'); worker = worker0(); worker.postMessage({ type: 'init' }); };

worker = worker0(); worker.postMessage({ type: 'init' });
renderFiles(); openFile(project.get(project.active) ? project.active : project.main);
window.__app = { project, openFile, compile, addFile };       // handy for tests / the console
</script>
</body>
</html>
